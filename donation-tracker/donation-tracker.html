<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiXELL River Financial - Donation Tracker</title>
    <link rel="stylesheet" href="/template.css">
    <link rel="stylesheet" href="/donation-tracker/donation-tracker.css">
</head>

<body>
    <header class="site-header">
        <h1>PRF: Donation Tracker</h1>
        <p>This tool will help us monitor and manage donations</p>
    </header>
    <nav class="site-nav">
        <ul class="nav-list">
            <li><a href="/donation-tracker/donation-tracker.html">Donation Tracker</a></li>
            <li><a href="volunteer-tracker.html">Volunteer Hours</a></li>
            <li><a href="event-signup.html">Event signup</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <form id="donation-tracker-form">
                <h2 id="donation-form-title">Donation Form</h2>
                <fieldset id="simple-input-fieldset">
                    <div class="single-input-container" id="charity-name-input-container">
                        <label for="charity-name-input">Chosen Charity</label>
                        <input type="text" id="charity-name-input" name="charity-name-input">
                    </div>
                    <div class="single-input-container" id="amount-input-container">
                        <label for="">Amount (USD):</label>
                        <input type="number" id="amount-input" name="amount-input" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="single-input-container" id="date-input-container">
                        <label for="date-input">Donation Date</label>
                        <input type="date" id="date-input" name="date-input" readonly>
                    </div>
                </fieldset>
                <fieldset id="centered-input-fieldset">
                    <div class="single-input-container" id="message-input-container">
                        <label for="message-input">Donation Message</label>
                        <textarea name="message-input" id="message-input" rows="15"></textarea>
                    </div>
                    <input type="submit" name="submit-button" id="submit-button" value="Make Donation">
                </fieldset>
                
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p class="footer-copy">&copy; 2026 PiXELL River Financial. All rights reserved.</p>
        <nav class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Accessibility</a>
            <a href="#">Contact Us</a>
        </nav>
    </footer>
    <script src="/template.js"></script>
    <script src="/donation-tracker/donation-tracker.js"></script>
</body>

</html>
